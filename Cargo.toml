[package]
name = "fleet"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Fleet CLI for SSH, tmux sessions, and localhost forwards"

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
clap_complete = "4.5.50"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
toml = "0.8.23"
